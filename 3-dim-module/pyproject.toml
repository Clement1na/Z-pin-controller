[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cnc-grbl"
version = "0.1.0"
description = "Send G-code to ESP32 Grbl / FluidNC over serial"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyserial>=3.5",
]

[tool.setuptools.packages.find]
where = ["src"]
