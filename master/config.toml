# v0.2 live-machine template. Deliberately incomplete: --live fails before
# opening hardware until measured values and the work zero are supplied.
# --smoke-test and --simulate do not read this file.

[servo]
adapter = ""               # pysoem adapter name for the wired EtherCAT NIC
lead_mm = 13.3333333      # measured equivalent pitch per motor revolution
counts_per_rev = 262144
vel_mm_s = 1.0

[cnc3d]
port = ""                  # TTC450 Pro USB serial port
baud = 115200
feed = 1500
x_max = 100.0             # replace with measured safe work-coordinate limit
y_max = 100.0
z_max = 50.0
# scan_z_mm = ...         # manually verified height safe for XY scanning

[head]
port = ""                  # GX28 controller USB serial port
baud = 115200
travel_mm = 50.0          # nominal firmware coordinate limit, NOT useful window
firmware_verified = false
datum_confirmed = false
# standby_mm = ...        # actual position after opening the serial connection
# insertion_mm = ...      # smaller coordinate: tested downward direction
# work_min_mm = ...       # measured useful range, not full 50 mm
# work_max_mm = ...

[cycle]
valve_delay_ms = 500
upper_release_after_retract = false  # confirm on machine before full job

